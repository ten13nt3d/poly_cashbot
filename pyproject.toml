[tool.poetry]
name = "poly-cashbot"
version = "0.1.0"
description = "XRP Polymarket Cash Bot - Automated trading for crypto 15-minute prediction markets"
authors = ["Development Team <dev@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0"
alembic = "^1.13"
pydantic = "^2.5"
pydantic-settings = "^2.1"
httpx = "^0.26"
redis = "^5.0"
psycopg2-binary = "^2.9"
asyncpg = "^0.29"
py-clob-client = "^0.20"
python-dotenv = "^1.0"
structlog = "^24.1"
pandas = "^2.1"
numpy = "^1.24"
apscheduler = "^3.10"
websockets = "^12.0"
python-telegram-bot = "^20.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
black = "^23.12"
mypy = "^1.8"
ruff = "^0.1"
ipdb = "^0.13"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "websockets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
