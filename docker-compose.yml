# XRP Polymarket Cash Bot - Docker Compose Configuration
# Usage:
#   docker-compose up -d        # Start all services
#   docker-compose logs -f bot  # View bot logs
#   docker-compose down         # Stop all services

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: poly_cashbot_db
    environment:
      POSTGRES_DB: ${DB_NAME:-poly_cashbot}
      POSTGRES_USER: ${DB_USER:-cashbot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cashbot_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: poly_cashbot_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Trading Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poly_cashbot
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-cashbot_user}:${DB_PASSWORD:-dev_password}@postgres:5432/${DB_NAME:-poly_cashbot}

      # Redis
      REDIS_URL: redis://redis:6379

      # Polymarket API
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY}
      POLYMARKET_CHAIN_ID: ${POLYMARKET_CHAIN_ID:-137}
      POLYMARKET_HOST: ${POLYMARKET_HOST:-https://clob.polymarket.com}

      # Trading Configuration
      STARTING_CAPITAL: ${STARTING_CAPITAL:-1000}
      PAPER_TRADING: ${PAPER_TRADING:-true}
      MIN_CONFIDENCE_THRESHOLD: ${MIN_CONFIDENCE_THRESHOLD:-0.80}
      MIN_SENTIMENT_THRESHOLD: ${MIN_SENTIMENT_THRESHOLD:-40}

      # Risk Management
      PER_TRADE_RISK_PCT: ${PER_TRADE_RISK_PCT:-0.02}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-0.10}
      MAX_CONCURRENT_POSITIONS: ${MAX_CONCURRENT_POSITIONS:-3}

      # Telegram (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped

    # Override command for different modes
    # command: python -m src.bot.main --mode live

  # Prometheus (Optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: poly_cashbot_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles: ["monitoring"]

  # Grafana (Optional - for dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: poly_cashbot_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: poly_cashbot_network
